<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALLE TUNING | Sistema de Inventario</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>CALLE <span>TUNING</span></h1>
        <p>Sistema de inventario</p>
      </div>

      <nav class="nav">
        <div class="nav-title">Principal</div>
        <button class="active" data-module="dashboard" onclick="mostrarModulo('dashboard')">
          <span class="nav-icon">◆</span> Dashboard
        </button>

        <div class="nav-title">Gestión</div>
        <button data-module="productos" onclick="mostrarModulo('productos')">
          <span class="nav-icon">▣</span> Productos
        </button>
        <button data-module="categorias" onclick="mostrarModulo('categorias')">
          <span class="nav-icon">▤</span> Categorías
        </button>
        <button data-module="marcas" onclick="mostrarModulo('marcas')">
          <span class="nav-icon">M</span> Marcas
        </button>
        <button data-module="proveedores" onclick="mostrarModulo('proveedores')">
          <span class="nav-icon">P</span> Proveedores
        </button>
        <button data-module="clientes" onclick="mostrarModulo('clientes')">
          <span class="nav-icon">C</span> Clientes
        </button>

        <div class="nav-title">Sistema</div>
        <button data-module="usuarios" onclick="mostrarModulo('usuarios')">
          <span class="nav-icon">U</span> Usuarios
        </button>
        <button data-module="roles" onclick="mostrarModulo('roles')">
          <span class="nav-icon">R</span> Roles
        </button>
        <button data-module="ventas" onclick="mostrarModulo('ventas')">
          <span class="nav-icon">$</span> Ventas
        </button>
        <button data-module="detalles-venta" onclick="mostrarModulo('detalles-venta')">
          <span class="nav-icon">D</span> Detalles de venta
        </button>
        <button data-module="movimientos-inventario" onclick="mostrarModulo('movimientos-inventario')">
          <span class="nav-icon">↕</span> Movimientos
        </button>
      </nav>

      <div class="sidebar-footer">Calle Tuning · Ayacucho</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="topTitle">Dashboard</h2>
          <p>Administración de inventario y ventas</p>
        </div>
        <div class="user-box">
          <a href="/tienda.html" style="margin-right:14px;color:inherit;text-decoration:none">Ver tienda ↗</a>
          <span>Panel de gestión</span>
          <div class="user-avatar">A</div>
        </div>
      </header>

      <section class="content" id="appContent"></section>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Nuevo registro</h3>
        <button class="close" onclick="cerrarModal()">×</button>
      </div>
      <form class="form" id="dataForm"></form>
    </div>
  </div>

  <div class="toast" id="toast"></div>


  <script src="/js/api.js"></script>

  <!-- Configuración de módulos -->
  <script src="/js/utils.js"></script>
  <script src="/js/modules/dashboard.js"></script>
  <script src="/js/modules/productos.js"></script>
  <script src="/js/modules/categorias.js"></script>
  <script src="/js/modules/marcas.js"></script>
  <script src="/js/modules/proveedores.js"></script>
  <script src="/js/modules/clientes.js"></script>
  <script src="/js/modules/usuarios.js"></script>
  <script src="/js/modules/roles.js"></script>
  <script src="/js/modules/ventas.js"></script>
  <script src="/js/modules/detalles-venta.js"></script>
  <script src="/js/modules/movimientos.js"></script>

  <!-- Controlador principal -->
  <script src="/js/app.js"></script>

</body>

</html>
